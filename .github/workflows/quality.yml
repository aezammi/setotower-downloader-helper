name: Helper quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Validate scripts
        run: |
          python -m py_compile linux/setotower-helper.py
          python -m unittest discover -s tests -v
          bash -n linux/install.sh linux/uninstall.sh linux/build-deb.sh
          node --check engine/cineb-hls.mjs
          systemd-analyze verify linux/setotower-helper.service

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
      - name: Install pinned build tools
        shell: powershell
        run: |
          $ffmpegZip = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-essentials.zip'
          $ffmpegExtract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest `
                -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' `
                -OutFile $ffmpegZip
              Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $ffmpegBinary = Get-ChildItem -Path $ffmpegExtract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if ($null -eq $ffmpegBinary) { throw 'Pinned FFmpeg release was not downloaded' }
          $ffmpegBin = $ffmpegBinary.Directory.FullName
          $ffmpegRoot = $ffmpegBinary.Directory.Parent.FullName
          $ffmpegLicense = Join-Path $ffmpegRoot 'LICENSE.txt'
          if (-not (Test-Path $ffmpegLicense)) {
            $licenseSource = Get-ChildItem -Path $ffmpegRoot -Recurse -File |
              Where-Object { $_.Name -match '^LICENSE(\.|$)' } |
              Select-Object -First 1
            if ($null -eq $licenseSource) { throw 'FFmpeg license file was not found in the downloaded release' }
            Copy-Item -LiteralPath $licenseSource.FullName -Destination $ffmpegLicense -Force
          }
          $ytDlpVersion = '2026.10.26'
          $ytDlpPath = Join-Path $env:RUNNER_TEMP 'yt-dlp.exe'
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/$ytDlpVersion/yt-dlp.exe" `
            -OutFile $ytDlpPath
          if (-not (Test-Path $ytDlpPath)) { throw 'Pinned yt-dlp release was not downloaded' }
          $env:GITHUB_PATH | Out-Null
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $ytDlpPath)
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegBin
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$(Split-Path $ytDlpPath);$ffmpegBin;$machinePath;$userPath;$env:PATH"
          Get-Command yt-dlp.exe
          Get-Command ffmpeg.exe
          Get-Command node.exe
      - name: Build reproducible helper release
        shell: powershell
        run: |
          .\windows\build.ps1
      - name: Verify release artifacts
        shell: powershell
        run: |
          if (-not (Test-Path windows\release\helper.exe)) { throw 'helper.exe was not produced' }
          if (-not (Test-Path windows\release\tools-v1.zip)) { throw 'tools-v1.zip was not produced' }
          if (-not (Test-Path windows\uninstall.ps1)) { throw 'uninstall.ps1 was not produced' }
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path windows\uninstall.ps1),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'uninstall.ps1 failed PowerShell parsing' }
          Get-FileHash windows\release\helper.exe,windows\release\tools-v1.zip -Algorithm SHA256
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: setotower-windows-helper
          path: windows/release/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject credential-shaped source values
        run: |
          ! grep -RInE '(cfat_|AWS_SECRET_ACCESS_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|CLOUDFARE_ACCOUNT_TOKEN)' . --exclude-dir=.git --exclude='quality.yml'
