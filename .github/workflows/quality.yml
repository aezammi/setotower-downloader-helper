name: Helper quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate scripts
        run: |
          python -m py_compile linux/setotower-helper.py
          bash -n linux/install.sh linux/build-deb.sh
          node --check engine/cineb-hls.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        shell: powershell
        run: choco install yt-dlp ffmpeg nodejs-lts -y --no-progress
      - name: Build reproducible helper release
        shell: powershell
        run: |
          .\windows\build.ps1
      - name: Verify release artifacts
        shell: powershell
        run: |
          if (-not (Test-Path windows\release\helper.exe)) { throw 'helper.exe was not produced' }
          if (-not (Test-Path windows\release\tools-v1.zip)) { throw 'tools-v1.zip was not produced' }
          Get-FileHash windows\release\helper.exe,windows\release\tools-v1.zip -Algorithm SHA256
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: setotower-windows-helper
          path: windows/release/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential-shaped source values
        run: |
          ! grep -RInE '(cfat_|AWS_SECRET_ACCESS_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|CLOUDFARE_ACCOUNT_TOKEN)' . --exclude-dir=.git --exclude='quality.yml'
